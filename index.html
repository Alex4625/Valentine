<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Nona</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/envelope.css">
</head>
<body>
    <!-- Decorative floating hearts and roses -->
    <div class="floating-hearts">
        <div class="floating-heart">❤️</div>
        <div class="floating-heart">💕</div>
        <div class="floating-heart">💗</div>
        <div class="floating-heart">💖</div>
        <div class="floating-heart">💝</div>
        <div class="floating-heart">💞</div>
        <div class="floating-heart">🤍</div>
    </div>

    <div class="decorative-roses">
        <div class="rose">🌹</div>
        <div class="rose">🌹</div>
        <div class="rose">🌹</div>
        <div class="rose">🌹</div>
        <div class="rose">🌹</div>
    </div>

    <div class="envelope-page">
        <div class="envelope" id="envelope">
            <div class="flap" id="flap"></div>
            <div class="body">
                <div class="letter">
                    <h1 class="letter-title">Untuk Nona</h1>
                    <p class="letter-sub">Dibuka dengan hati yang hangat</p>
                    <button id="openBtn" class="open-btn">Buka Surat</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/envelope.js"></script>
</body>
</html>
